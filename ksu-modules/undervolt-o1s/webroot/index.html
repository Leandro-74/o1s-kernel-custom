<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Undervolt</title>
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --line: #e3e6eb;
    --text: #101114;
    --muted: #6e7787;
    --accent: #0381fe;
    --accent-soft: #e8f1fe;
    --warn: #c47b0a;
    --warn-soft: #fdf3e2;
    --danger: #d8343b;
    --danger-soft: #fdeaea;
    --track: #dfe3ea;
    --radius: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101114;
      --surface: #1b1c1e;
      --line: #2a2c2f;
      --text: #f2f4f7;
      --muted: #9aa1ac;
      --accent: #4da3ff;
      --accent-soft: #14263a;
      --warn: #f5b65c;
      --warn-soft: #33270f;
      --danger: #ff6b6b;
      --danger-soft: #3a1c1d;
      --track: #34373b;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.2px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border-radius: 16px;
    padding: 12px 16px; margin-bottom: 16px;
    font-size: 14px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dot.off { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
  .pill-text { flex: 1; }
  .pill-val { color: var(--muted); font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .item { padding: 16px 18px 14px; }
  .item + .item { border-top: 1px solid var(--line); }

  .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .label { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 7px; }
  .hint { color: var(--muted); font-size: 13px; }
  .pending {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); display: none;
  }
  .item.dirty .pending { display: inline-block; }

  .badge {
    display: inline-flex; align-items: baseline; gap: 1px;
    font-variant-numeric: tabular-nums; color: var(--accent);
    background: var(--accent-soft); border-radius: 12px;
    padding: 4px 11px; flex: 0 0 auto;
  }
  .badge .num { font-size: 20px; font-weight: 700; }
  .badge .pct { font-size: 12px; font-weight: 600; opacity: .8; }
  .item.warn .badge { color: var(--warn); background: var(--warn-soft); }
  .item.danger .badge { color: var(--danger); background: var(--danger-soft); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 28px; margin: 10px 0 0;
    background: transparent; display: block;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, currentColor var(--fill, 0%), var(--track) var(--fill, 0%));
    color: var(--accent);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px; margin-top: -10px;
    border-radius: 50%; background: #fff; border: 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .28);
  }
  .item.warn input[type=range]::-webkit-slider-runnable-track { color: var(--warn); }
  .item.danger input[type=range]::-webkit-slider-runnable-track { color: var(--danger); }
  input[type=range]:disabled::-webkit-slider-thumb { background: var(--track); box-shadow: none; }
  input[type=range]:disabled::-webkit-slider-runnable-track {
    background: var(--track) !important;
  }

  /* Firefox: só para o preview local sair igual ao WebView do Android. */
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 2px; background: var(--track);
  }
  input[type=range]::-moz-range-progress {
    height: 4px; border-radius: 2px; background: var(--accent);
  }
  input[type=range]::-moz-range-thumb {
    width: 24px; height: 24px; border: 0; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .28);
  }
  .item.warn input[type=range]::-moz-range-progress { background: var(--warn); }
  .item.danger input[type=range]::-moz-range-progress { background: var(--danger); }

  .item-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 2px; color: var(--muted); font-size: 12.5px;
  }
  .item-foot .rail { font-variant-numeric: tabular-nums; }

  .foot { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 16px 2px 0; }

  .actions { margin-top: 20px; display: flex; flex-direction: column; gap: 6px; }
  button {
    font-family: inherit; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 26px; padding: 15px 18px;
    color: #fff; background: var(--accent);
    transition: opacity .15s, transform .1s;
  }
  button:active { transform: scale(.985); }
  button:disabled { opacity: .4; }
  button.text { background: transparent; color: var(--accent); padding: 12px; }
  button.text:disabled { opacity: .4; }

  .scrim {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .42);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 10;
  }
  .scrim[hidden] { display: none; }
  .dialog {
    background: var(--surface); border-radius: 26px; padding: 24px 22px 16px;
    width: 100%; max-width: 360px;
  }
  .dialog h2 { font-size: 19px; margin: 0 0 8px; }
  .dialog p { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 4px; }
  .dialog-actions button {
    background: transparent; color: var(--accent);
    font-size: 15px; font-weight: 600; padding: 12px 16px;
  }
  .dialog-actions button:active { background: var(--accent-soft); }
</style>
</head>
<body>

<header>
  <h1>Undervolt</h1>
  <p class="sub">Exynos 2100</p>
</header>

<div class="pill">
  <span class="dot" id="dot"></span>
  <span class="pill-text" id="pillText">Verificando módulo…</span>
  <span class="pill-val" id="pillVal"></span>
</div>

<section class="card" id="card"></section>

<p class="foot">
  Percentual de redução sobre a tensão do domínio. O padrão do módulo é
  <strong>3 / 3 / 3 / 1</strong>. O teto é <strong>10%</strong>; acima de 5% o
  aparelho pode reiniciar.
</p>

<div class="actions">
  <button id="apply" disabled>Aplicar</button>
  <button id="reset" class="text" disabled>Restaurar padrão</button>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle">Valor acima do testado</h2>
    <p id="dialogBody"></p>
    <div class="dialog-actions">
      <button class="text" id="dialogCancel">Cancelar</button>
      <button id="dialogOk">Aplicar</button>
    </div>
  </div>
</div>

<script>
const DOMAINS = [
  { key: "cpucl0", label: "CPU Little", hint: "CL0 · 4 núcleos", pmic: "s2mps24", reg: "1f" },
  { key: "cpucl1", label: "CPU Big",    hint: "CL1 · 3 núcleos", pmic: "s2mps24", reg: "23" },
  { key: "cpucl2", label: "CPU Prime",  hint: "CL2 · 1 núcleo",  pmic: "s2mps24", reg: "27" },
  { key: "gpu",    label: "GPU",        hint: "G3D · Mali-G78",  pmic: "s2mps23", reg: "1e" }
];

const DEFAULT = { cpucl0: 3, cpucl1: 3, cpucl2: 3, gpu: 1 };
const MAX = 10;
const WARN_AT = 4;
const DANGER_AT = 7;
const CONFIRM_AT = 5;

let applied = {};
let draft = {};
let rails = [null, null, null, null];
let loaded = false;

function sh(cmd) {
  try {
    const out = ksu.exec(cmd);
    return out == null ? "" : String(out).trim();
  } catch (e) {
    return "";
  }
}

function path(key) {
  return "/sys/kernel/exynos_uv/" + key + "_uv_percent";
}

function readInt(cmd) {
  const raw = sh(cmd);
  const n = parseInt(raw, 10);
  return isNaN(n) ? null : n;
}

function railCommand() {
  let cmd =
    'p24=$(ls -d /sys/class/pmic/s2mps24@* 2>/dev/null);' +
    'p23=$(ls -d /sys/class/pmic/s2mps23@* 2>/dev/null);' +
    'reg(){ if [ -z "$1" ]; then echo "?"; return; fi;' +
    ' printf "0x01%s" "$3" > "$1/$2_read" 2>/dev/null;' +
    ' v=$(sed "s/.*: //" "$1/$2_read" 2>/dev/null);' +
    ' if [ -z "$v" ]; then echo "?"; else echo $((v)); fi; };';
  DOMAINS.forEach((d) => {
    const dir = d.pmic === "s2mps24" ? "$p24" : "$p23";
    cmd += 'echo "$(reg ' + dir + " " + d.pmic + " " + d.reg + ')";';
  });
  return cmd;
}

function readRails() {
  const out = sh(railCommand());
  const parts = out.split(/\s+/).filter((s) => s !== "");
  rails = DOMAINS.map((_, i) => {
    const v = parseInt(parts[i], 10);
    return isNaN(v) ? null : v;
  });
}

function railMv(index) {
  const v = rails[index];
  if (v == null) return null;
  return Math.round(300 + 6.25 * v);
}

function refreshStatus() {
  const dot = document.getElementById("dot");
  const text = document.getElementById("pillText");
  const val = document.getElementById("pillVal");

  loaded = sh("lsmod | grep -c '^undervolt_o1s '") !== "0";
  dot.className = "dot " + (loaded ? "on" : "off");
  text.textContent = loaded ? "Módulo carregado" : "Módulo não carregado";
  val.textContent = loaded
    ? DOMAINS.map((d) => applied[d.key]).join(" / ")
    : "";
}

function build() {
  const card = document.getElementById("card");
  card.innerHTML = "";
  DOMAINS.forEach((d, i) => {
    const item = document.createElement("div");
    item.className = "item";
    item.dataset.key = d.key;
    item.innerHTML =
      '<div class="item-top">' +
        '<div class="meta">' +
          '<span class="label">' + d.label + '<span class="pending"></span></span>' +
          '<span class="hint">' + d.hint + '</span>' +
        '</div>' +
        '<span class="badge"><span class="num">0</span><span class="pct">%</span></span>' +
      '</div>' +
      '<input type="range" min="0" max="' + MAX + '" step="1" value="0" aria-label="' +
        d.label + '">' +
      '<div class="item-foot">' +
        '<span class="rail">tensão atual —</span>' +
        '<span>0–' + MAX + '%</span>' +
      '</div>';

    const input = item.querySelector("input");
    input.addEventListener("input", () => {
      draft[d.key] = parseInt(input.value, 10);
      paint(d.key);
      updateActions();
    });

    card.appendChild(item);
  });
}

function band(v) {
  if (v >= DANGER_AT) return "danger";
  if (v >= WARN_AT) return "warn";
  return "";
}

function paint(key) {
  const item = document.querySelector('.item[data-key="' + key + '"]');
  if (!item) return;
  const input = item.querySelector("input");
  const num = item.querySelector(".num");
  const value = draft[key];

  num.textContent = value;
  input.value = value;
  input.style.setProperty("--fill", (value / MAX) * 100 + "%");
  item.className = "item " + band(value);
  item.classList.toggle("dirty", value !== applied[key]);
}

function paintRails() {
  DOMAINS.forEach((d, i) => {
    const el = document.querySelector('.item[data-key="' + d.key + '"] .rail');
    if (!el) return;
    const mv = railMv(i);
    el.textContent = "tensão atual " + (mv == null ? "—" : mv + " mV");
  });
}

function dirtyKeys() {
  return DOMAINS.map((d) => d.key).filter((k) => draft[k] !== applied[k]);
}

function updateActions() {
  const dirty = dirtyKeys().length > 0;
  document.getElementById("apply").disabled = !loaded || !dirty;
  document.getElementById("reset").disabled = !loaded;
  DOMAINS.forEach((d) => {
    const item = document.querySelector('.item[data-key="' + d.key + '"]');
    if (item) item.querySelector("input").disabled = !loaded;
  });
}

function load(keepDraft) {
  const prev = draft;
  const dirty = keepDraft ? dirtyKeys() : [];
  applied = {};
  DOMAINS.forEach((d) => {
    const v = readInt("cat " + path(d.key) + " 2>/dev/null");
    applied[d.key] = v == null ? DEFAULT[d.key] : v;
  });
  draft = Object.assign({}, applied);
  dirty.forEach((k) => { draft[k] = prev[k]; });
  refreshStatus();
  if (loaded) readRails();
  DOMAINS.forEach((d) => paint(d.key));
  paintRails();
  updateActions();
}

function writeValues(keys) {
  let failures = [];
  keys.forEach((key) => {
    const out = sh("sh -c 'echo " + draft[key] + " > " + path(key) + " && echo ok || echo fail'");
    if (out.indexOf("ok") === -1) failures.push(key);
  });
  return failures;
}

function toast(msg) {
  try {
    ksu.toast(msg);
  } catch (e) {}
}

function applyNow(keys) {
  const failures = writeValues(keys);
  load();
  if (failures.length) {
    toast("Falha em " + failures.length + " domínio(s)");
  } else {
    toast("Undervolt atualizado");
  }
}

function askConfirm(keys) {
  const body = document.getElementById("dialogBody");
  const names = keys
    .filter((k) => draft[k] > CONFIRM_AT)
    .map((k) => DOMAINS.find((d) => d.key === k).label + " " + draft[k] + "%");
  body.textContent =
    names.join(", ") + ". Acima de " + CONFIRM_AT +
    "% não há teste longo o bastante; o aparelho pode reiniciar sozinho.";
  document.getElementById("scrim").hidden = false;
  pendingKeys = keys;
}

let pendingKeys = null;

document.getElementById("dialogCancel").addEventListener("click", () => {
  document.getElementById("scrim").hidden = true;
  pendingKeys = null;
});

document.getElementById("dialogOk").addEventListener("click", () => {
  document.getElementById("scrim").hidden = true;
  const keys = pendingKeys;
  pendingKeys = null;
  if (keys) applyNow(keys);
});

document.getElementById("apply").addEventListener("click", () => {
  const keys = dirtyKeys();
  if (!keys.length) return;
  if (keys.some((k) => draft[k] > CONFIRM_AT)) {
    askConfirm(keys);
  } else {
    applyNow(keys);
  }
});

document.getElementById("reset").addEventListener("click", () => {
  DOMAINS.forEach((d) => { draft[d.key] = DEFAULT[d.key]; });
  applyNow(DOMAINS.map((d) => d.key));
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") load(true);
});

setInterval(() => {
  if (document.visibilityState === "visible" && loaded) {
    readRails();
    paintRails();
  }
}, 5000);

build();
load();
</script>
</body>
</html>
